name: blog CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: 30.1

      - name: Install Emacs package dependencies
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install 'dash)" \
            --eval "(package-install 'f)" \
            --eval "(package-install 's)" \
            --eval "(package-install 'org-static-blog)" \
            --eval "(package-install 'htmlize)" \
            --eval "(package-install 'org-special-block-extras)"

  # Build every article and deploy public/ to the gh-pages branch.
  #
  # How this works:
  #   master branch  →  only .org sources + config (clean; no HTML clutter)
  #   CI builds all posts, writes HTML to public/, copies CSS/images there too.
  #   peaceiris/actions-gh-pages force-pushes public/ contents to gh-pages branch.
  #   GitHub Pages is configured to serve from gh-pages (root /).
  #   Result: alhassy.com/foo   (flat URL, no /public/ prefix)
  #
  # You never commit HTML to master. You never touch gh-pages directly.
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: 30.1

      - name: Install Emacs package dependencies
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install 'dash)" \
            --eval "(package-install 'f)" \
            --eval "(package-install 's)" \
            --eval "(package-install 'org-static-blog)" \
            --eval "(package-install 'htmlize)" \
            --eval "(package-install 'org-special-block-extras)"

      - name: Build all articles
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(setq org-confirm-babel-evaluate nil)" \
            --eval "(setq org-export-with-broken-links t)" \
            --eval "(setq blog-publish-directory \"./public\")" \
            --eval "(setq blog-posts-directory \"./\")" \
            --eval "(load-file \"AlBasmala.el\")" \
            --eval "(blog-publish-all)"

      - name: Deploy public/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: alhassy.com
