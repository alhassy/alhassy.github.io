name: blog CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: 30.1

      - name: Install Emacs package dependencies
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install 'dash)" \
            --eval "(package-install 'f)" \
            --eval "(package-install 's)" \
            --eval "(package-install 'lf)" \
            --eval "(package-install 'org-static-blog)" \
            --eval "(package-install 'htmlize)" \
            --eval "(package-install 'org-special-block-extras)"

      - name: Validate: no orphan HTML files
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(setq org-confirm-babel-evaluate nil)" \
            --eval "(load-file \"AlBasmala.el\")" \
            --eval "(blog--validate-no-orphan-html)"
