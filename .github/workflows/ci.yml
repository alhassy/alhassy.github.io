name: blog CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Serialise deploys so two quick master pushes don't race on the
# gh-pages force-push.  Queue rather than cancel — every deploy lands.
concurrency:
  group: pages
  cancel-in-progress: false

# Build .org → public/, force-push to gh-pages on master.  See README.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: 30.1

      - name: Cache Emacs packages
        uses: actions/cache@v4
        with:
          path: ~/.emacs.d/elpa
          key: elpa-${{ runner.os }}-emacs30.1-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Emacs package dependencies
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(unless (file-exists-p (expand-file-name \"archives/melpa\" package-user-dir)) (package-refresh-contents))" \
            --eval "(dolist (p '(dash f s htmlize org-special-block-extras org-contrib org-modern)) (unless (package-installed-p p) (package-install p)))"

      - name: Build all articles
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(setq org-confirm-babel-evaluate nil)" \
            --eval "(setq org-export-with-broken-links t)" \
            --eval "(setq blog-publish-directory \"./public/\")" \
            --eval "(setq blog-posts-directory \"./\")" \
            --eval "(require 'ob-tangle)" \
            --eval "(org-babel-tangle-file \"AlBasmala.org\")" \
            --eval "(org-babel-load-file \"AlBasmala.org\")" \
            --eval "(blog-publish-all)"

      - name: Deploy public/ to gh-pages
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: alhassy.com
