name: blog CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  # :REDIRECT: articles track their repos' tips, which don't trigger us; so rebuild daily too.
  # Cron fields are "minute hour day-of-month month day-of-week", so "17 6 * * *" ≡ every day at 06:17 UTC
  # ---best-effort: GitHub starts scheduled runs late under load, often by hours.
  schedule:
    - cron: "17 6 * * *"

# Serialise deploys so two quick master pushes don't race on the
# gh-pages force-push.  Queue rather than cancel ---every deploy lands.
concurrency:
  group: pages
  cancel-in-progress: false

# Build .org → public/, force-push to gh-pages on master.  See README.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: 30.1

      # org-special-block-extras' graph block, in its manual, draws with Graphviz.
      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      # … and, under :smartdiagram, typesets with pdflatex, then pdftoppm (poppler) makes the PNG.
      # tlmgr resolves no dependencies, so we list what a smartdiagram's standalone document loads;
      # cached, a minimal TeX Live costs seconds rather than texlive-full's gigabytes.
      - name: Install a minimal TeX Live, for smartdiagrams
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            standalone
            preview
            smartdiagram
            pgf
            xkeyval
            xstring
            etoolbox
            varwidth
            xcolor

      - name: Install poppler, for pdftoppm
        run: sudo apt-get install -y poppler-utils

      # A key unique to each run never hits exactly, so the newest elpa-…-* cache is restored
      # (restore-keys) and, after the upgrade below, saved anew.  A fixed key would hit forever and
      # never be re-saved, freezing our packages at whatever MELPA had when the key last changed.
      - name: Cache Emacs packages
        uses: actions/cache@v6
        with:
          path: ~/.emacs.d/elpa
          key: elpa-${{ runner.os }}-emacs30.1-${{ github.run_id }}
          restore-keys: elpa-${{ runner.os }}-emacs30.1-

      # org-special-block-extras comes from GitHub master, not MELPA: its manual, which we publish
      # via a :REDIRECT: to master, uses features that MELPA's build may not have caught up to yet.
      # So we axe any cached copy and clone master afresh, ~2s; package-vc-upgrade-all pulls async, so
      # in batch it never lands.
      # TODO: Install org-special-block-extras from MELPA again, once it stabilises.
      - name: Install Emacs package dependencies
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(setq package-archives '((\"gnu\" . \"https://elpa.gnu.org/packages/\") (\"melpa\" . \"https://melpa.org/packages/\")) package-install-upgrade-built-in t)" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(dolist (p '(dash f s htmlize)) (unless (package-installed-p p) (package-install p)))" \
            --eval "(dolist (d (cdr (assq 'org-special-block-extras package-alist))) (package-delete d t))" \
            --eval "(package-vc-install (quote (org-special-block-extras :url \"https://github.com/alhassy/org-special-block-extras\" :lisp-dir \"lisp\")))" \
            --eval "(package-upgrade-all)"

      - name: Build all articles
        run: |
          mkdir -p ~/.emacs.d
          printf '* Mini-tutorial-on-Org-mode\n:PROPERTIES:\n:CUSTOM_ID: Mini-tutorial-on-Org-mode\n:END:\n' > ~/.emacs.d/init.org
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(setq package-archives '((\"melpa\" . \"https://melpa.org/packages/\")))" \
            --eval "(package-initialize)" \
            --load ox-extra.el \
            --eval "(defun not-currently-working-with (&optional _) \"\")" \
            --eval "(defun currently-working-with (&optional _) \"\")" \
            --eval "(setq org-confirm-babel-evaluate nil)" \
            --eval "(setq org-defblock-evaluate-switches t)" \
            --eval "(setq blog-publish-directory \"./public/\")" \
            --eval "(setq blog-posts-directory \"./\")" \
            --eval "(require 'ob-tangle)" \
            --eval "(org-babel-tangle-file \"AlBasmala.org\")" \
            --eval "(load-file \"AlBasmala.el\")" \
            --eval "(blog-publish-all)"

      - name: Deploy public/ to gh-pages
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: alhassy.com
